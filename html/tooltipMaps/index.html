<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="container">
      <div id="dropdown">
        <span class="icon"><img src="src/pin.png" alt="" /></span>
        <ul class="dropdown-menu">
          <li value="pasture1">Pasto 1</li>
          <li value="pasture2">Pasto 2</li>
          <li value="pasture3">Pasto 3</li>
        </ul>
      </div>

      <div id="map">
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d1966.0660272610053!2d-38.15953760159865!3d-5.150738157305238!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e1!3m2!1spt-BR!2sbr!4v1699473844679!5m2!1spt-BR!2sbr"
          width="600"
          height="450"
          style="border: 0"
          allowfullscreen="false"
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
        ></iframe>

        <div id="pastures">
          <div id="pasture1" class="pasture bg-green">Pasto 1</div>
          <div id="pasture2" class="pasture bg-blue">Pasto 2</div>
          <div id="pasture3" class="pasture bg-red">Pasto 3</div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
